interface:
  display_name: "发布照片头像打码"
  short_description: "保留指定人物，用内置头像遮挡其他人的正脸及可辨认侧脸，复查补漏，不新增 AI 生成水印"
  default_prompt: "用 $photo-privacy-avatar 处理我提供的照片，保留我指定的人物，用内置头像遮住其他人的正脸及仍可辨认的侧脸。这是隐私打码编辑，不是普通图片生成，不得新增 AI 生成相关的可见水印、文字、Logo 或角标。若结果仍有本次编辑新增且非工具强制保留的水印，直接调用图像编辑模型自身的局部修复能力去除，保持头像遮挡完整。全部处理后统一复查，发现遗漏就补打码并再次检查，确认没有新增 AI 标记后再交付。"
