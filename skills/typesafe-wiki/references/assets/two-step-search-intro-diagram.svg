      34%  { transform: translate(648px, 120px) scale(3.3333333333333335, 0.9285714285714286); }
      60%  { transform: translate(648px, 120px) scale(3.3333333333333335, 0.9285714285714286); }
      78%  { transform: translate(1106px, 190px) scale(3.3333333333333335, 0.9285714285714286); }
