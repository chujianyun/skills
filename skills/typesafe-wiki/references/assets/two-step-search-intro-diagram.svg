  @keyframes stage-3-active {
    0% { fill: #7c7c77; } 66% { fill: #7c7c77; } 74% { fill: #34342f; } 100% { fill: #34342f; }
  }

    .arrow-1 { animation: arrow-1-fade 12s ease-in-out infinite; }
